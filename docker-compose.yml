# The demo tools, as one service serving REST and MCP.
#
#   docker compose up -d
#
# Joins the platform's network so the platform can reach it by name. The
# platform's compose project is `indicusai` by default; override with
# PLATFORM_NETWORK if yours differs.
services:
  mcp-tools:
    build: .
    container_name: mcp-tools
    restart: unless-stopped
    environment:
      # Additional Host values this may be reached as, beyond mcp-tools and
      # localhost. MCP's DNS-rebinding protection rejects anything unlisted.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      # So the seeds run from inside this container with no extra flags:
      #   docker compose exec mcp-tools python seeds/soc.py
      # Both defaults are wrong on a laptop and right here — in a container
      # 127.0.0.1 is the container, so neither the platform nor these services
      # can be reached at it.
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://api:8000/api/v1}
      # What an export link should say, so a client can click it. The platform's
      # Caddy routes /discom/exports/* here; set this to the same address Caddy
      # serves. Left as localhost it still works on the box, just not for anyone
      # else.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8304}
      DEMO_HOST: ${DEMO_HOST:-mcp-tools}
    ports:
      # Published so the tools can be exercised with curl from the box. The
      # platform reaches them over the shared network, not through this.
      - "127.0.0.1:8304:8304"
    volumes:
      # The visit recordings, which cannot be generated on Linux.
      - ./data:/app/data:ro
    networks: [platform]

networks:
  platform:
    name: ${PLATFORM_NETWORK:-indicusai_default}
    external: true
