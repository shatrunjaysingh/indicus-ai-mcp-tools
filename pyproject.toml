[project]
name = "indicus-ai-mcp-tools"
version = "0.1.0"
description = "Demo services for the IndicusAI platform, served as REST tools and as an MCP server."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "mcp>=1.2",
]

[project.optional-dependencies]
# Only the utility demo needs speech-to-text, and onnxruntime is a couple of
# hundred megabytes. Kept optional so the other services install in seconds.
stt = ["faster-whisper>=1.0"]

[tool.ruff]
line-length = 100
